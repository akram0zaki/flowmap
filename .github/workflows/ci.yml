name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and property tests
        run: pnpm test

      - name: i18n contract
        run: pnpm i18n:check

      - name: Formatting
        run: pnpm format:check

  # Cross-platform breakage found at packaging time is the most expensive kind,
  # so both desktop targets build from the first runnable skeleton onward —
  # not at the end. See docs/spec/11-quality-performance.md §7.
  desktop:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and property tests
        run: pnpm test

      - name: Build frontend bundle
        run: pnpm --filter @flowmap/desktop build

      # Cross-platform breakage found at packaging time is the most expensive
      # kind. `cargo check` catches it in ~1 min instead of a full release build.
      - name: Check desktop shell compiles
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

  security:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level high
